site_name: Agentic AI Security SDK
site_description: Open-source execution security runtime for agentic AI systems
site_url: https://tommycharade.github.io/aai-sec-sdk/
repo_url: https://github.com/tommycharade/aai-sec-sdk
repo_name: tommycharade/aai-sec-sdk

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
  palette:
    - scheme: default
      primary: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

strict: true
docs_dir: docs
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
exclude_docs: |
  README.md

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Security model: security-model.md
  - Operational runbooks: runbooks.md
  - Testing and assurance: testing.md
  - Production readiness: production-readiness.md
  - Architecture: architecture.md
  - Agent integrations: integrations.md
  - Claude Code example: claude-code.md
  - Codex CLI example: codex-cli.md
  - Management UI: ui.md
  - Enterprise fleet: enterprise-fleet.md
  - Policy editor: policy-editor.md
  - Managed Claude resources: claude-managed-resources.md
  - Wider enterprise UI: enterprise-ui.md
  - Enterprise integration design: enterprise-integration-design.md
  - Enterprise user journeys: enterprise-user-journeys.md
  - Enterprise operations readiness: enterprise-operations-readiness.md
  - Product Owner rollout review: product-owner-enterprise-claude-rollout-review-2026-07-27.md
  - Enterprise Claude Code rollout plan: enterprise-claude-rollout-plan.md
  - Real Claude Code acceptance evidence: real-claude-code-acceptance-evidence-2026-07-27.md
  - AWS deployment: aws-deployment.md
  - Code-owned controls: code-owned-controls.md
  - End-to-end example: end-to-end-example.md
  - API reference: api.md
  - Engineering guardrails: guardrails.md
  - Licensing: license.md
  - Contributing: contributing.md
  - Releasing: releasing.md
  - Deployment evidence: deployment-evidence.md
  - P1/P2 closure evidence: p1-p2-closure-evidence-2026-07-27.md
  - Release evidence v1.0.1: release-evidence-v1.0.1.md
  - Critical adopter review (2026-07-25): critical-adopter-review-2026-07-25.md
  - Critical adopter review (2026-07-26): critical-adopter-review-2026-07-26.md
