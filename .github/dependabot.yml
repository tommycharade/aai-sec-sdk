version: 2
updates:
  - package-ecosystem: npm
    directory: "/infra/aws-control-plane"
    schedule:
      interval: daily
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
  - package-ecosystem: gomod
    directory: "/terraform-provider-aai-sec"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
