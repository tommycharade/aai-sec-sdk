name: macos-sensor-artifact

on:
  pull_request:
    paths:
      - ".github/workflows/macos-sensor-artifact.yml"
      - "requirements-sensor-build.txt"
      - "scripts/build_macos_endpoint_sensor_artifact.py"
      - "scripts/collect_endpoint_evidence.py"
      - "scripts/test_macos_endpoint_sensor_artifact.py"
      - "tests/test_macos_endpoint_sensor_artifact.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adhoc-acceptance:
    name: ad-hoc acceptance (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262b # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: requirements-sensor-build.txt
      - name: Install exact sensor build inputs
        run: python -m pip install --disable-pip-version-check -r requirements-sensor-build.txt
      - name: Build and independently verify test-only artifact
        env:
          SENSOR_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          source_sha="$(shasum -a 256 scripts/collect_endpoint_evidence.py | awk '{print $1}')"
          version="$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          output="$RUNNER_TEMP/aai-endpoint-evidence-$SENSOR_ARCHITECTURE"
          python scripts/build_macos_endpoint_sensor_artifact.py build \
            --source "$GITHUB_WORKSPACE/scripts/collect_endpoint_evidence.py" \
            --expected-source-sha256 "$source_sha" \
            --expected-python-version 3.13.14 \
            --version "$version" \
            --source-commit "$GITHUB_SHA" \
            --architecture "$SENSOR_ARCHITECTURE" \
            --output-directory "$output" \
            --allow-adhoc
          manifest_sha="$(shasum -a 256 "$output/artifact-manifest.json" | awk '{print $1}')"
          python scripts/build_macos_endpoint_sensor_artifact.py verify \
            --artifact-directory "$output" \
            --expected-manifest-sha256 "$manifest_sha" \
            --expected-version "$version" \
            --expected-source-commit "$GITHUB_SHA" \
            --expected-source-sha256 "$source_sha" \
            --expected-python-version 3.13.14 \
            --expected-architecture "$SENSOR_ARCHITECTURE" \
            --allow-adhoc
          COPYFILE_DISABLE=1 tar -C "$RUNNER_TEMP" -czf \
            "$RUNNER_TEMP/aai-endpoint-evidence-$SENSOR_ARCHITECTURE-adhoc-test.tar.gz" \
            "aai-endpoint-evidence-$SENSOR_ARCHITECTURE"
      - name: Upload disposable cross-architecture evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-sensor-${{ matrix.architecture }}-adhoc-test
          path: ${{ runner.temp }}/aai-endpoint-evidence-${{ matrix.architecture }}-adhoc-test.tar.gz
          if-no-files-found: error
          retention-days: 7
