name: cdk-upstream-watch

on:
  pull_request:
    paths:
      - "infra/aws-control-plane/package.json"
      - "infra/aws-control-plane/package-lock.json"
      - ".github/workflows/cdk-upstream-watch.yml"
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

jobs:
  audit-pinned-deployment-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262b # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/aws-control-plane/package-lock.json
      - name: Audit exact pinned CDK toolchain
        working-directory: infra/aws-control-plane
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

  inspect-bundled-dependency:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect latest published AWS CDK bundle
        shell: bash
        run: |
          set -euo pipefail
          latest="$(npm view aws-cdk-lib version)"
          mkdir -p "$RUNNER_TEMP/cdk-package"
          npm --loglevel=error pack "aws-cdk-lib@$latest" \
            --pack-destination "$RUNNER_TEMP/cdk-package" >/dev/null
          archive="$(find "$RUNNER_TEMP/cdk-package" -type f -name '*.tgz' -print -quit)"
          test -n "$archive"
          bundled="$(
            tar -xOf "$archive" \
              package/node_modules/brace-expansion/package.json \
              | node -e 'let data=""; process.stdin.on("data", chunk => data += chunk); process.stdin.on("end", () => console.log(JSON.parse(data).version));'
          )"
          {
            echo "## AWS CDK bundled dependency watch"
            echo
            echo "- Latest aws-cdk-lib: $latest"
            echo "- Bundled brace-expansion: $bundled"
            echo "- Current advisory: GHSA-rgw5-rvv9-x895"
            echo "- Required fixed version: 5.0.9 or later"
          } >> "$GITHUB_STEP_SUMMARY"
          if node -e '
            const current = process.argv[1].split(".").map(Number);
            const fixed = [5, 0, 9];
            const comparable = current.every(Number.isInteger) && current.length === 3;
            if (!comparable) process.exit(2);
            for (let index = 0; index < fixed.length; index += 1) {
              if (current[index] > fixed[index]) process.exit(0);
              if (current[index] < fixed[index]) process.exit(1);
            }
            process.exit(0);
          ' "$bundled"; then
            echo "::error::AWS CDK now contains the patched dependency. Upgrade the exact pin and verify a clean full audit."
            exit 1
          fi
          echo "::error::AWS CDK remains affected by GHSA-rgw5-rvv9-x895 and no owner-approved exception covers it."
          exit 1
