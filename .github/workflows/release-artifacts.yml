name: release-artifacts

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262b # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          make check
          make package-check
      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install cyclonedx-bom==7.2.1
          cyclonedx-py environment --of JSON --output-file dist/sbom.json
      - name: Generate checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence
          path: dist/
      - name: Attest release provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.0
        with:
          subject-path: "dist/*.whl"
