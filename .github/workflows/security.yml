name: dependency-security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262b # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-ci.txt -r requirements-build.txt && python -m pip install -e . --no-deps
      - name: Audit dependencies
        run: make security-check
      - name: Run bounded mutation gate
        run: make mutation
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-evidence
          path: .mutmut-cache/
          if-no-files-found: error
          include-hidden-files: true
