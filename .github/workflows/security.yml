name: dependency-security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262b # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-ci.txt -r requirements-build.txt && python -m pip install -e . --no-deps
      - name: Audit dependencies
        run: make security-check
      - name: Run bounded mutation gate
        run: make mutation
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-evidence
          path: .mutmut-cache/
          if-no-files-found: error
          include-hidden-files: true
