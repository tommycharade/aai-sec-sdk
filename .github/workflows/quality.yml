name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262b # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: terraform-provider-aai-sec/go.mod
          cache-dependency-path: terraform-provider-aai-sec/go.sum
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.11.3"
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run all project guardrails
        run: make check
      - name: Validate package artifacts
        if: matrix.python-version == '3.13'
        run: make package-check

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentic_security
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentic_security"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262b # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install PostgreSQL integration dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,postgres]'
      - name: Run live PostgreSQL fleet integration
        env:
          AAI_SEC_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/agentic_security
        run: python -m pytest -q tests/test_enterprise_postgres_integration.py

  docker-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262b # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install SDK
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Build isolation evidence worker
        run: docker build --tag aai-sec-isolation-probe:ci tests/fixtures/docker-worker
      - name: Verify restrictive Docker boundary
        run: |
          # A locally built image has no registry RepoDigest. Its content-addressed
          # image ID is still immutable and is the correct local verification input.
          image_ref="$(docker image inspect aai-sec-isolation-probe:ci --format '{{.Id}}')"
          python scripts/test_docker_sandbox.py --image "$image_ref"

  passive-cell-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262b # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/aws-control-plane/package-lock.json
      - name: Install pinned AWS infrastructure dependencies
        working-directory: infra/aws-control-plane
        run: npm ci
      - name: Synthesize non-serving passive cell
        working-directory: infra/aws-control-plane
        env:
          RECOVERY_AWS_ACCOUNT_ID: "111111111111"
          RECOVERY_REGION: eu-west-1
          PRIMARY_REGION: eu-west-2
          RECOVERY_CONTROL_TABLE: AaiControl
          RECOVERY_PRESENCE_TABLE: AaiPresence
          RECOVERY_IDEMPOTENCY_TABLE: AaiIdempotency
          RECOVERY_SCIM_TABLE: AaiScim
          RECOVERY_AUDIT_BUCKET: aai-audit-replica-111111
          RECOVERY_POLICY_SIGNING_KEY_ARN: arn:aws:kms:eu-west-1:111111111111:key/mrk-1234567890abcdef1234567890abcdef
          RECOVERY_ASSURANCE_REPORT_SIGNING_KEY_ARN: arn:aws:kms:eu-west-1:111111111111:key/mrk-abcdef1234567890abcdef1234567890
          RECOVERY_USER_POOL_ID: eu-west-1_AbCdEf123
          RECOVERY_USER_POOL_CLIENT_ID: abcdefghij1234567890
          RECOVERY_CELL_MODE: standby
        run: npm run synth:passive -- --quiet
      - name: Verify synthesized cell has no executable authority
        run: >-
          python scripts/verify_passive_regional_cell.py
          infra/aws-control-plane/cdk.out/AaiSecPassiveRegionalCell.template.json

  active-cell-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262b # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/aws-control-plane/package-lock.json
      - name: Install pinned AWS infrastructure dependencies
        working-directory: infra/aws-control-plane
        run: npm ci
      - name: Synthesize active recovery runtime without routing
        working-directory: infra/aws-control-plane
        env:
          RECOVERY_AWS_ACCOUNT_ID: "111111111111"
          RECOVERY_REGION: eu-west-1
          PRIMARY_REGION: eu-west-2
          RECOVERY_CONTROL_TABLE: AaiControl
          RECOVERY_PRESENCE_TABLE: AaiPresence
          RECOVERY_IDEMPOTENCY_TABLE: AaiIdempotency
          RECOVERY_SCIM_TABLE: AaiScim
          RECOVERY_AUDIT_BUCKET: aai-audit-replica-111111
          RECOVERY_POLICY_SIGNING_KEY_ARN: arn:aws:kms:eu-west-1:111111111111:key/mrk-1234567890abcdef1234567890abcdef
          RECOVERY_ASSURANCE_REPORT_SIGNING_KEY_ARN: arn:aws:kms:eu-west-1:111111111111:key/mrk-abcdef1234567890abcdef1234567890
          RECOVERY_USER_POOL_ID: eu-west-1_AbCdEf123
          RECOVERY_USER_POOL_CLIENT_ID: abcdefghij1234567890
          RECOVERY_CELL_MODE: active
          RECOVERY_ACTIVATION_EVIDENCE_SHA256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          RECOVERY_STABLE_UI_ORIGIN: https://security.example.com
          ENTRA_TENANT_ID: 12345678-1234-4234-8234-123456789abc
          ENTRA_AAI_TENANT_ID: tenant-demo
          ENTRA_STRONG_AUTH_ENFORCED: "true"
        run: npm run synth:passive -- --quiet
      - name: Verify active runtime authority remains bounded and unrouted
        run: >-
          python scripts/verify_active_regional_cell.py
          infra/aws-control-plane/cdk.out/AaiSecPassiveRegionalCell.template.json
          --activation-evidence-sha256
          aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          --signing-key-arn
          arn:aws:kms:eu-west-1:111111111111:key/mrk-1234567890abcdef1234567890abcdef
          --assurance-signing-key-arn
          arn:aws:kms:eu-west-1:111111111111:key/mrk-abcdef1234567890abcdef1234567890
          --entra-tenant-id
          12345678-1234-4234-8234-123456789abc
          --aai-tenant-id
          tenant-demo
          --stable-ui-origin
          https://security.example.com

  policy-source-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262b # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/aws-control-plane/package-lock.json
      - name: Install policy-source contract dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Install pinned AWS infrastructure dependencies
        working-directory: infra/aws-control-plane
        run: npm ci
      - name: Prove GitHub App token-broker contracts
        working-directory: infra/aws-control-plane
        run: npm run test:github-app
      - name: Prove delivery-package deployment authority
        working-directory: infra/aws-control-plane
        run: npm run test:delivery-authority
      - name: Prove policy-source verifier privilege separation
        run: python -m pytest -q tests/test_aws_policy_source_stack.py

  transition-journal-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262b # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/aws-control-plane/package-lock.json
      - name: Install pinned AWS infrastructure dependencies
        working-directory: infra/aws-control-plane
        run: npm ci
      - name: Synthesize independent single-writer transition witness
        working-directory: infra/aws-control-plane
        env:
          CDK_DEFAULT_ACCOUNT: "111111111111"
          TRANSITION_COORDINATION_REGION: eu-central-1
          PRIMARY_REGION: eu-west-2
          RECOVERY_REGION: eu-west-1
          TRANSITION_JOURNAL_TABLE_NAME: AaiSecRegionalTransitionJournal
        run: npm run synth:journal -- --quiet
      - name: Verify witness is retained, unreplicated and has no runtime authority
        run: >-
          python scripts/verify_transition_journal_stack.py
          infra/aws-control-plane/cdk.out/AaiSecRegionalTransitionJournal.template.json
          --table-name AaiSecRegionalTransitionJournal

  regional-ingress-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262b # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/aws-control-plane/package-lock.json
      - name: Install pinned AWS infrastructure dependencies
        working-directory: infra/aws-control-plane
        run: npm ci
      - name: Synthesize Regional custom domains without routing
        working-directory: infra/aws-control-plane
        env:
          REGIONAL_INGRESS_CELL_ROLE: recovery
          REGIONAL_INGRESS_STACK_NAME: AaiSecRecoveryRegionalIngress
          REGIONAL_INGRESS_AWS_ACCOUNT_ID: "111111111111"
          REGIONAL_INGRESS_REGION: eu-west-1
          REGIONAL_INGRESS_CONTROL_API_ID: abcdefghij
          REGIONAL_INGRESS_UI_BUCKET: aai-recovery-ui-111111
          REGIONAL_INGRESS_CERTIFICATE_ARN: arn:aws:acm:eu-west-1:111111111111:certificate/12345678-1234-4234-8234-123456789abc
          REGIONAL_INGRESS_COGNITO_ORIGIN: https://aai-recovery.auth.eu-west-1.amazoncognito.com
          REGIONAL_INGRESS_STABLE_API_DOMAIN: api.security.example.com
          REGIONAL_INGRESS_STABLE_UI_DOMAIN: security.example.com
          REGIONAL_INGRESS_CANARY_API_DOMAIN: api-recovery.security.example.com
          REGIONAL_INGRESS_CANARY_UI_DOMAIN: recovery.security.example.com
        run: npm run synth:ingress -- --quiet
      - name: Verify domains, origins, mapping targets, and zero routing authority
        run: >-
          python scripts/verify_regional_ingress_stack.py
          infra/aws-control-plane/cdk.out/AaiSecRecoveryRegionalIngress.template.json
          --cell-role recovery
          --control-api-id abcdefghij
          --ui-bucket aai-recovery-ui-111111
          --certificate-arn
          arn:aws:acm:eu-west-1:111111111111:certificate/12345678-1234-4234-8234-123456789abc
          --cognito-origin https://aai-recovery.auth.eu-west-1.amazoncognito.com
          --stable-api-domain api.security.example.com
          --stable-ui-domain security.example.com
          --canary-api-domain api-recovery.security.example.com
          --canary-ui-domain recovery.security.example.com

  regional-fault-controller-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262b # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/aws-control-plane/package-lock.json
      - name: Install pinned AWS infrastructure dependencies
        working-directory: infra/aws-control-plane
        run: npm ci
      - name: Synthesize private compensated Regional fault controller
        working-directory: infra/aws-control-plane
        env:
          CDK_DEFAULT_ACCOUNT: "111111111111"
          TRANSITION_COORDINATION_REGION: eu-central-1
          TRANSITION_JOURNAL_TABLE_NAME: AaiSecRegionalTransitionJournal
          TRANSITION_JOURNAL_TABLE_ARN: arn:aws:dynamodb:eu-central-1:111111111111:table/AaiSecRegionalTransitionJournal
          FAULT_SECURITY_ALERT_TOPIC_ARN: arn:aws:sns:eu-central-1:111111111111:aai-sec-security-alerts
          FAULT_ROUTE53_HOSTED_ZONE_ID: Z1234567890ABC
          PRIMARY_FAULT_REGION: eu-west-2
          PRIMARY_FAULT_TARGET_ROLE_ARN: arn:aws:iam::111111111111:role/AaiPrimaryHandler
          PRIMARY_FAULT_TARGET_FUNCTION_ARN: arn:aws:lambda:eu-west-2:111111111111:function:AaiPrimaryHandler
          PRIMARY_FAULT_AUDIT_BUCKET_ARN: arn:aws:s3:::aai-primary-audit-111111
          PRIMARY_FAULT_DYNAMODB_TABLE_ARNS: '["arn:aws:dynamodb:eu-west-2:111111111111:table/AaiControl","arn:aws:dynamodb:eu-west-2:111111111111:table/AaiPresence","arn:aws:dynamodb:eu-west-2:111111111111:table/AaiIdempotency","arn:aws:dynamodb:eu-west-2:111111111111:table/AaiScim"]'
          PRIMARY_FAULT_SIGNING_KEY_ARN: arn:aws:kms:eu-west-2:111111111111:key/mrk-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          PRIMARY_FAULT_QUEUE_ARNS: '["arn:aws:sqs:eu-west-2:111111111111:aai-primary-evidence"]'
          RECOVERY_FAULT_REGION: eu-west-1
          RECOVERY_FAULT_TARGET_ROLE_ARN: arn:aws:iam::111111111111:role/AaiRecoveryHandler
          RECOVERY_FAULT_TARGET_FUNCTION_ARN: arn:aws:lambda:eu-west-1:111111111111:function:AaiRecoveryHandler
          RECOVERY_FAULT_AUDIT_BUCKET_ARN: arn:aws:s3:::aai-recovery-audit-111111
          RECOVERY_FAULT_DYNAMODB_TABLE_ARNS: '["arn:aws:dynamodb:eu-west-1:111111111111:table/AaiControl","arn:aws:dynamodb:eu-west-1:111111111111:table/AaiPresence","arn:aws:dynamodb:eu-west-1:111111111111:table/AaiIdempotency","arn:aws:dynamodb:eu-west-1:111111111111:table/AaiScim"]'
          RECOVERY_FAULT_SIGNING_KEY_ARN: arn:aws:kms:eu-west-1:111111111111:key/mrk-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          RECOVERY_FAULT_QUEUE_ARNS: '["arn:aws:sqs:eu-west-1:111111111111:aai-recovery-evidence"]'
        run: npm run synth:fault-controller -- --quiet
      - name: Verify live probe gate, compensation, alerts and least privilege
        run: >-
          python scripts/verify_regional_fault_controller_stack.py
          infra/aws-control-plane/cdk.out/AaiSecRegionalFaultController.template.json
          --journal-table-name AaiSecRegionalTransitionJournal
          --journal-table-arn arn:aws:dynamodb:eu-central-1:111111111111:table/AaiSecRegionalTransitionJournal
          --primary-role-arn arn:aws:iam::111111111111:role/AaiPrimaryHandler
          --recovery-role-arn arn:aws:iam::111111111111:role/AaiRecoveryHandler
          --alert-topic-arn arn:aws:sns:eu-central-1:111111111111:aai-sec-security-alerts

  evidence-continuity-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262b # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/aws-control-plane/package-lock.json
      - name: Install pinned AWS infrastructure dependencies
        working-directory: infra/aws-control-plane
        run: npm ci
      - name: Synthesize and verify recovery-to-primary evidence continuity
        working-directory: infra/aws-control-plane
        env:
          CDK_DEFAULT_ACCOUNT: "111111111111"
          AUDIT_REPLICA_REGION: eu-west-1
          PRIMARY_AUDIT_REGION: eu-west-2
          PRIMARY_AUDIT_BUCKET_ARN: arn:aws:s3:::aai-primary-audit-111111
        run: |
          npx cdk --app 'npx ts-node --prefer-ts-exts bin/audit-replica.ts' synth AaiSecAuditReplica --quiet
          python3 ../../scripts/verify_aws_evidence_continuity.py cdk.out/AaiSecAuditReplica.template.json --destination-bucket-arn "$PRIMARY_AUDIT_BUCKET_ARN" --rule-id replicate-recovery-audit-to-primary-region
      - name: Synthesize and verify primary-to-recovery evidence continuity
        working-directory: infra/aws-control-plane
        env:
          CDK_DEFAULT_ACCOUNT: "111111111111"
          CDK_DEFAULT_REGION: eu-west-2
          AUDIT_REPLICA_REGION: eu-west-1
          AUDIT_REPLICA_BUCKET_ARN: arn:aws:s3:::aai-recovery-audit-111111
        run: |
          npx cdk --app 'npx ts-node --prefer-ts-exts bin/aws-control-plane.ts' synth AaiSecControlPlane --quiet
          python3 ../../scripts/verify_aws_evidence_continuity.py cdk.out/AaiSecControlPlane.template.json --destination-bucket-arn "$AUDIT_REPLICA_BUCKET_ARN" --rule-id replicate-audit-to-recovery-region
