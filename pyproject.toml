[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-security-sdk"
version = "1.1.0"
description = "Execution security runtime for agentic AI systems"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Tom Mooney" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "ruff==0.15.17",
  "mypy==2.1.0",
  "pre-commit==4.6.1",
  "mkdocs==1.6.1",
  "mkdocs-material==9.7.7",
  "mkdocstrings[python]==0.30.1",
  "build==1.5.0",
  "twine==6.2.0",
  "pip-audit==2.10.1",
  "mutmut==3.6.0",
  "opentelemetry-api==1.42.1",
]
docs = [
  "mkdocs==1.6.1",
  "mkdocs-material==9.7.7",
  "mkdocstrings[python]==0.30.1",
]
otel = [
  "opentelemetry-api>=1.28,<2",
]
postgres = [
  "psycopg[binary]>=3.3,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "D"]
ignore = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"scripts/**/*.py" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mutmut]
source_paths = ["src/agentic_security"]
only_mutate = [
  "src/agentic_security/components.py",
  "src/agentic_security/runtime.py",
  "src/agentic_security/approvals.py",
  "src/agentic_security/budgets.py",
  "src/agentic_security/credentials.py",
  "src/agentic_security/idempotency.py",
  "src/agentic_security/isolation.py",
  "src/agentic_security/policies.py",
  "src/agentic_security/policy_adapters.py",
  "src/agentic_security/audit.py",
  "src/agentic_security/adapters.py",
]
pytest_add_cli_args_test_selection = ["tests"]
pytest_add_cli_args = [
  "-k",
  "not test_handler_completion_is_local_and_stress_timeouts_do_not_retain_registry",
]
also_copy = [
  "examples/",
  "scripts/",
  "AGENTS.md",
  "CONTRIBUTING.md",
  "README.md",
  "docs/",
  "Makefile",
  "LICENSE",
  "NOTICE",
  "TRADEMARKS.md",
  "requirements-ci.txt",
  "requirements-build.txt",
  "mutation-baseline.json",
]
mutate_only_covered_lines = true
timeout_constant = 1.0
timeout_multiplier = 2.0
